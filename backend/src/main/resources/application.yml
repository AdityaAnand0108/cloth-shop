spring:
  application:
    name: cloth-shop

  datasource:
    # Use Neon's pooled JDBC URL for normal application traffic.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5          # Keep a small pool for this single-store app.
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 900000

  jpa:
    hibernate:
      ddl-auto: validate            # Flyway owns the schema. Never 'update'.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    # Neon recommends a direct connection for migrations; the app datasource can
    # remain pooled. If omitted locally, fall back to DB_URL.
    url: ${DB_MIGRATION_URL:${DB_URL}}
    user: ${DB_USER}
    password: ${DB_PASSWORD}

server:
  port: ${PORT:8080}
  error:
    include-message: always

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    enabled: ${APP_SECURITY_ENABLED:false}
  inventory:
    default-location-code: MAIN
  shop:
    # The shop's own day. A sale rung up at 9pm belongs to that day, not to UTC's
    # next one, and "today's takings" has to agree with the till.
    zone: Asia/Kolkata

logging:
  level:
    com.clothshop: DEBUG
