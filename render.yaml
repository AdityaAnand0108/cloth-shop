services:
  - type: web
    name: bflex-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_MIGRATION_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_SECURITY_ENABLED
        value: "true"
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
